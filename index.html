<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos do Dia - Onde Assistir</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4">
    <header class="w-full mb-6">
        <h1 class="text-2xl font-bold text-emerald-800 text-center">⚽ Jogos do Dia - Onde Assistir</h1>
    </header>
    <div id="filter-panel" class="w-full bg-white rounded-lg shadow-md p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div class="flex-1 min-w-0">
            <label for="searchInput" class="block text-sm font-medium text-gray-700 mb-1">Buscar times</label>
            <input type="text" id="searchInput" placeholder="Digite o nome do time..." class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div class="flex-1 min-w-0">
            <label for="leagueFilter" class="block text-sm font-medium text-gray-700 mb-1">Filtrar por liga</label>
            <select id="leagueFilter" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <option value="">Todas as Ligas</option>
            </select>
        </div>
    </div>
    <div id="loading" class="w-full text-center py-4">
        <p class="text-gray-500">Carregando jogos...</p>
    </div>
    <div id="games-grid" class="w-full max-w-6xl flex flex-col gap-4 mb-10"></div>
</body>
</html>
