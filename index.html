<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogos do Dia - Onde Assistir</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <style>
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
    @keyframes livePulse{0%,100%{opacity:1}50%{opacity:.4}}.live-pulse{animation:livePulse 1.5s ease-in-out infinite}
    @keyframes skeleton-loading{0%{background-position:-200px 0}100%{background-position:calc(200px + 100%) 0}}
    .skeleton-line{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200px 100%;animation:skeleton-loading 1.5s infinite ease-in-out}
    .dark .skeleton-line{background:linear-gradient(90deg,#374151 25%,#1f2937 50%,#374151 75%);background-size:200px 100%}
    #filter-panel{max-height:0;overflow:hidden;transition:max-height .3s ease,opacity .3s ease;opacity:0}
    #filter-panel.open{max-height:200px;opacity:1}
    .game-row:hover{background:rgba(34,197,94,.05)}
  </style>
</head>
<body class="bg-slate-100 dark:bg-[#0a0f1e] min-h-screen transition-colors duration-200 dark:text-slate-100">

  <header class="sticky top-0 z-50 bg-white dark:bg-[#0f172a] border-b border-slate-200 dark:border-slate-800 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="text-xl">⚽</span>
        <h1 class="text-base font-bold text-slate-800 dark:text-white">
          Jogos do Dia
          <span class="hidden sm:inline text-slate-400 dark:text-slate-500 font-normal text-sm"> — Onde Assistir</span>
        </h1>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-toggle-filters" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h18M7 12h10M11 20h2"/></svg>
          <span class="hidden sm:inline">Filtros</span>
          <span id="filter-badge" class="hidden bg-emerald-500 text-white text-xs rounded-full w-4 h-4 items-center justify-center">!</span>
        </button>
        <button id="theme-toggle" class="w-9 h-9 flex items-center justify-center rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 transition-colors text-lg">🌙</button>
      </div>
    </div>
    <div id="filter-panel" class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-[#0f172a]">
      <div class="max-w-5xl mx-auto px-4 py-3 flex flex-col sm:flex-row gap-3">
        <input type="text" id="searchInput" placeholder="🔍  Buscar time..." class="flex-1 px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <select id="leagueFilter" class="flex-1 px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="">Todas as Ligas</option>
        </select>
        <button id="btn-clear-filters" class="px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">Limpar</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 pb-16">
    <!-- Indicadores do dia -->
    <div id="stats-container" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 hidden">
      <div id="stat-total-games" class="text-center p-3 bg-white dark:bg-[#111827] rounded-lg border border-slate-200 dark:border-slate-800">
        <div class="text-xs text-slate-500 dark:text-slate-400 font-medium">Total de jogos</div>
        <div id="stat-total-value" class="text-2xl font-bold mt-1">0</div>
      </div>
      <div id="stat-live-games" class="text-center p-3 bg-white dark:bg-[#111827] rounded-lg border border-slate-200 dark:border-slate-800">
        <div class="text-xs text-slate-500 dark:text-slate-400 font-medium">Ao vivo</div>
        <div id="stat-live-value" class="text-2xl font-bold mt-1 text-emerald-600">0</div>
      </div>
      <div id="stat-games-broadcast" class="text-center p-3 bg-white dark:bg-[#111827] rounded-lg border border-slate-200 dark:border-slate-800">
        <div class="text-xs text-slate-500 dark:text-slate-400 font-medium">Com transmissão</div>
        <div id="stat-broadcast-value" class="text-2xl font-bold mt-1">0</div>
      </div>
    </div>

    <!-- Última atualização -->
    <div id="last-updated-container" class="mb-4 text-center text-xs text-slate-500 dark:text-slate-400 hidden">
      Atualizado às <span id="last-updated-time">--:--</span>
    </div>

    <!-- Controle de atualização discreto -->
    <div class="my-4 flex justify-center">
      <button id="btn-update-games" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-lg transition-colors flex items-center gap-2">
        <span class="text-slate-500 dark:text-slate-400">Atualizar</span>
        <svg id="update-icon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-14.736-8M15 9l3 3m0 0l-3 3m3-3V9H9m11 5h-.581m0 0a8.003 8.003 0 01-14.736 8"/>
        </svg>
      </button>
    </div>

    <!-- Loading state com skeletons -->
    <div id="loading-skeleton" class="hidden">
      <div class="space-y-4">
        <!-- Skeleton linhas (6 linhas fictícias) -->
        <div class="skeleton-line flex items-center gap-4 px-3 py-2">
          <div class="w-16 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="flex-1">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="w-14 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="w-14 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="flex-shrink-0 w-20">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
        </div>
        <div class="skeleton-line flex items-center gap-4 px-3 py-2">
          <div class="w-16 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="flex-1">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="w-14 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="w-14 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="flex-shrink-0 w-20">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
        </div>
        <div class="skeleton-line flex items-center gap-4 px-3 py-2">
          <div class="w-16 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="flex-1">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="w-14 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="w-14 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="flex-shrink-0 w-20">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
        </div>
        <div class="skeleton-line flex items-center gap-4 px-3 py-2">
          <div class="w-16 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="flex-1">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="w-14 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="w-14 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="flex-shrink-0 w-20">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
        </div>
        <div class="skeleton-line flex items-center gap-4 px-3 py-2">
          <div class="w-16 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="flex-1">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="w-14 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="w-14 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="flex-shrink-0 w-20">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
        </div>
        <div class="skeleton-line flex items-center gap-4 px-3 py-2">
          <div class="w-16 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="flex-1">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="w-14 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="w-14 flex-shrink-0">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
          <div class="flex-shrink-0 w-20">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-600 rounded"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Container para jogos -->
    <div id="games-grid" class="flex flex-col gap-4">
      <!-- Mensagem inicial será substituída pelo conteúdo real -->
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
